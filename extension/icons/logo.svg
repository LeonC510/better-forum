<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- hand-painted edges: slow, gentle wobble (no fuzz) -->
    <filter id="paint" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="128" height="128" fill="#000"/>
  <!-- "F+" drawn as shapes, so it renders the same without any font -->
  <g filter="url(#paint)" fill="#fff">
    <!-- F -->
    <path d="M 20 24 H 68 V 42 H 39 V 56 H 61 V 73 H 39 V 104 H 20 Z"/>
    <!-- + -->
    <path d="M 84 44 H 100 V 56 H 112 V 72 H 100 V 84 H 84 V 72 H 72 V 56 H 84 Z"/>
  </g>
</svg>
